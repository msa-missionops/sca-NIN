# Sample pipeline configuration.
#
# Copy this file (e.g. to config/settings.yaml) and update the paths for
# your environment, then run:
#
#   python -m nin_pipeline run --config config/settings.local.yaml
#
# See docs/NIN_Python_Plan.md section 8 for the full configuration
# strategy, and docs/nin_data_contracts.md for the reference-data file
# formats expected under `paths.reference_data_folder`
# (region.csv, top60.csv, sourceplant.csv, rec_req_type.csv,
# plant_evaluation.csv).

paths:
  prdpl3_folder: "\\\\filer3\\power_bi$\\GSP\\NIN\\output\\PRDPL3"
  mrp_rec_folder: "\\\\filer3\\power_bi$\\GSP\\NIN\\output\\MRP_REC"
  mrp_doh_folder: "\\\\filer3\\power_bi$\\GSP\\NIN\\output\\MRP_DOH"
  mb5t_folder: "\\\\filer3\\power_bi$\\GSP\\NIN\\output\\MB5T"
  reference_data_folder: "./reference_data"
  # Optional: run the pipeline for every plant listed in the latest file
  # under this folder (a headerless, single-column CSV of plant codes --
  # e.g. \\filer3\power_bi$\GSP\Stockout_Excel\Input), instead of the
  # single plant in reference_data/plant_evaluation.csv. See
  # docs/nin_data_contracts.md Open Decision #11.
  # active_plants_folder: "\\\\filer3\\power_bi$\\GSP\\Stockout_Excel\\Input"
  output_folder: "./output"
  run_folder: "./runs"
  log_folder: "./logs"

file_selection:
  strategy: latest_modified
  ignore_hidden: true
  # File extension filter used when locating each plant's latest
  # MRP_ELEMENTS_DOH/MRP_ELEMENTS_REC export (mirrors the FileExt
  # parameter in the original Power Query source). Defaults to "txt";
  # set to "csv" if the live SAP exports are written as .csv files.
  mrp_doh_file_extension: txt
  mrp_rec_file_extension: txt

output:
  write_parquet: true
  write_csv: true
  write_excel: true

