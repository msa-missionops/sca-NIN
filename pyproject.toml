[project]
name = "nin_python"
version = "0.1.0"
description = "NIN Python rebuild - transformation layer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=11.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[tool.poetry]

# Minimal pyproject to record project metadata. Use poetry/poetry-core or pip-tools as preferred later.

[tool.pytest.ini_options]
pythonpath = ["src"]
